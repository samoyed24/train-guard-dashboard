name: Worker Checks

on:
  pull_request:
    branches:
      - dev
    paths:
      - "worker/**"
      - ".github/workflows/worker-check.yml"
  push:
    branches:
      - dev
    paths:
      - "worker/**"
      - ".github/workflows/worker-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.8"

      - name: Install dependencies
        run: go mod download

      - name: Run syntax check
        run: go test ./...

      - name: Run build check
        run: go build ./...

      - name: Run dependency security audit
        run: |
          export GOBIN="${RUNNER_TEMP}"
          go install golang.org/x/vuln/cmd/govulncheck@latest
          export PATH="${GOBIN}:${PATH}"
          govulncheck ./...
