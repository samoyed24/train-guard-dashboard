name: Frontend Checks

on:
  pull_request:
    branches:
      - dev
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-build-check.yml"
  push:
    branches:
      - dev
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-build-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Resolve Vite base path
        run: |
          if [[ "${{ github.repository }}" == "${{ github.repository_owner }}/${{ github.repository_owner }}.github.io" ]]; then
            echo "VITE_BASE_PATH=/" >> "$GITHUB_ENV"
          else
            echo "VITE_BASE_PATH=/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run dependency security audit
        run: pnpm audit --audit-level=high --prod

      - name: Run syntax check
        run: pnpm run typecheck

      - name: Build frontend (mock mode)
        env:
          VITE_API_MODE: mock
          VITE_API_BASE_URL: http://localhost:8000
          VITE_MOCK_LOGIN_EMAIL: admin@train-guard.local
          VITE_MOCK_LOGIN_PASSWORD: 123456
        run: pnpm build
