name: Backend Checks

on:
  pull_request:
    branches:
      - dev
    paths:
      - "backend/**"
      - ".github/workflows/backend-check.yml"
  push:
    branches:
      - dev
    paths:
      - "backend/**"
      - ".github/workflows/backend-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run unit tests
        run: uv run python -m unittest discover -s tests -p "test*.py" -v

      - name: Run syntax check
        run: uv run python -m compileall app run.py tests

      - name: Run dependency security audit
        run: uvx pip-audit --path .venv
